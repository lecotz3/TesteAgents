# Polymarket Desk — parâmetros. Valores do guia original salvo indicação.
mode = "paper"                 # "paper" ou "live" (live exige também DESK_LIVE=I_UNDERSTAND no .env)
bankroll_start_usd = 100.0     # banca inicial (US$50 do guia fica abaixo da ordem mínima de 5 cotas)
state_dir = "state"            # banco SQLite, trades.txt e logs (relativo a este arquivo)

[scan]
max_markets_scanned = 1000
min_liquidity_usd = 5000.0
min_hours_to_resolution = 2.0
price_band = [0.03, 0.97]      # ignora mercados quase decididos
skip_categories = []           # ex.: ["crypto", "sports"]
allow_categories = []          # vazio = todas; ex.: ["weather"] para o pivô do guia

[analysis]
analyst = "claude"             # "claude" (Claude Code) ou "codex" (Codex CLI)
claude_model = "sonnet"
codex_model = ""               # vazio = modelo padrão do Codex
analyses_per_cycle = 3         # mercados novos por ciclo (~18/h). Pro: 2. Max: até 6. Ver docs/PENDENCIAS.md
max_analyses_per_day = 150     # teto de chamadas ao analista em 24h (protege o seu plano)
analysis_ttl_hours = 3.0
entry_analysis_max_age_minutes = 20   # antes de comprar, refaz análise mais velha que isso
held_reanalysis_minutes = 60
analyst_failure_cooldown_minutes = 30
analyst_timeout_seconds = 300
min_confidence = "medium"      # "low", "medium" ou "high"

[risk]
min_edge_pp = 8.0
max_exit_slippage = 0.03
kelly_fraction = 0.5
max_position_pct = 0.06
max_open_positions = 5
drawdown_halt = 1.0            # 1.0 = DESLIGADO só quando o dinheiro acabar (menos de US$1); 0.40 = ao cair 40% do pico

[exits]
exit_edge_closed_pp = 1.0
exit_fair_change_pp = 5.0
exit_hours_before_resolution = 1.0
reentry_cooldown_hours = 6.0   # depois de vender, não recompra o mesmo mercado por 6h (evita girar taxa)

[economy]
# O robô paga para existir: se não ganhar mais do que gasta, o dinheiro acaba e ele é DESLIGADO.
# daily_rent_usd = 0.67        # aluguel diário; comentado = subscription_cost_usd / 30 (assinatura rateada)
cost_per_analysis_usd = 0.01   # cada chamada ao analista (cada "pensamento") sai do caixa
max_daily_burn_pct = 0.015     # gasto máximo em 24h (aluguel + análises) como % da equity: com US$100, US$1,50/dia

[monthly]
subscription_cost_usd = 20.0
monthly_reserve_usd = 50.0

[memes]
# Agente de memecoins na Solana (as mesmas que aparecem no fomo.family). Banca, registro e diário separados
# do desk: state/memes.db e state/memes.txt. Comandos: python -m desk memes | memes-status | memes-live-check
enabled = true
mode = "paper"                 # "paper" simula com cotações reais da Jupiter; "live" exige MEMES_LIVE e a carteira
auto_trade = true              # false = só manda no Telegram os tokens aprovados e você decide (opção B)
notify_paper_trades = true     # avisa no Telegram também as compras/vendas simuladas
bankroll_start_usd = 100.0
analyst = "claude"             # "claude" checa reputação/narrativa antes de comprar (só veta); "none" = só as regras
cost_per_vet_usd = 0.01        # cada checagem do Claude sai do caixa (o agente paga para existir)
max_vets_per_day = 30          # sem checagem disponível ele não compra
max_vets_per_cycle = 2         # cada checagem leva minutos; o resto fica para o próximo ciclo
daily_rent_usd = 0.0           # o aluguel da assinatura já é pago pelo desk; suba se quiser cobrar dos dois
drawdown_halt = 1.0            # o dinheiro acabou (menos de US$1): DESLIGADO. 0.40 = desliga ao cair 40% do pico
daily_loss_pause_pct = 15      # perdeu 15% em 24h: pausa as compras (vendas continuam); 0 desliga

# Filtros de mercado (DexScreener)
min_liquidity_usd = 50000
min_age_minutes = 60           # a primeira hora é dos snipers e insiders
max_age_hours = 72
min_volume_h1_usd = 25000
min_txns_h1 = 200
min_buy_ratio_h1 = 0.45
max_change_h1_pct = 150        # não compra o que já subiu na vertical
min_change_h1_pct = -15
min_market_cap_usd = 150000
max_market_cap_usd = 25000000
min_organic_score = 50          # nota da Jupiter (0-100) para negociação real, não de bots; desconhecida = não checa

# Jupiter (cotações, trocas e listas). Sem chave: 0,5 chamada/s; com MEMES_JUPITER_API_KEY (grátis): 1/s
jup_api_url = "https://api.jup.ag"

# Descoberta: além das novidades do DexScreener, as listas da Jupiter (mais negociados, mais orgânicos, em alta)
jup_discovery = true
jup_categories = ["toptraded", "toporganicscore", "toptrending"]
jup_interval = "1h"

# Em alta (só acompanhar, não compra): as maiores movimentações da hora no painel, como o "Em alta" do fomo.family
movers_max_age_days = 7        # só memecoins: tokens mais velhos que isso (ZEC, HYPE...) ficam de fora
movers_keep = 20               # quantas guardar por ciclo, das maiores variações em 1h (para cima ou para baixo)

# Filtros de segurança (RugCheck)
min_lp_locked_pct = 80
max_top10_holders_pct = 30
max_insider_pct = 10
max_creator_pct = 5

# X (sem custo): o post ou o perfil que o token divulga, lido pela API pública do FxTwitter
x_enabled = true
x_require_link = true          # token sem link do X: pula (sem comunidade, sem narrativa)
x_min_narrative_views = 5000   # o post da narrativa precisa destas views...
x_min_narrative_likes = 50     # ...ou destes likes (posts antigos não mostram views)
x_min_profile_followers = 100  # perfil próprio do token: mínimo de seguidores

# Execução (Jupiter)
position_pct = 0.03            # 3% da banca por token (US$3 com US$100)
min_trade_usd = 1.0
max_positions = 4
max_round_trip_loss = 0.05     # comprar e vender de volta na hora não pode custar mais que 5%
max_price_impact_pct = 2.0
max_candidates_checked = 8     # tokens checados a fundo por ciclo
min_sol_balance = 0.05         # modo real: SOL para as taxas e ~0,002 SOL de aluguel por token novo na carteira
max_buy_drift_pct = 3          # a ordem de compra pode sair no máximo 3% pior que a cotação aprovada (senão, não compra)

# Saídas
stop_loss_pct = 30
take_profit_pct = 100          # dobrou: vende metade
take_profit_fraction = 0.5
trailing_stop_pct = 30         # caiu 30% do pico (depois de subir 20%+): vende tudo
trailing_activation_pct = 20
max_hold_hours = 24
liquidity_drain_pct = 50       # a liquidez caiu pela metade: sai
reentry_cooldown_hours = 24

# O que o paper precisa mostrar antes de dinheiro real (aparece no painel e no memes-status)
readiness_min_days = 14
readiness_min_trades = 30
